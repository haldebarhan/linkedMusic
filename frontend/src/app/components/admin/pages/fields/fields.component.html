<div class="admin-card">
  <div class="card-head d-flex justify-content-between align-items-center">
    <div>
      <h5 class="mb-0">Fields</h5>
      <div class="text-muted small">Manager les Fields</div>
    </div>
  </div>

  <div class="d-flex justify-content-end">
    <a class="btn btn-sm btn-primary" style="margin-right: 15px" (click)="goToCreate()">
      <i class="fas fa-plus me-1"></i>Ajouter
    </a>
  </div>
  <div class="admin-table-wrap">
    <hr />

    <div class="table-responsive">
      <table class="admin-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Label</th>
            <th>Recherchage</th>
            <th>Filtrable</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let field of rows; index as i">
            <!-- offset pour la numérotation -->
            <td data-label="#" class="text-muted">
              {{ field.id}}
            </td>
            <td data-label="label">
              {{ field.label }}
            </td>
            <td data-label="searchable">
              {{ field.searchable ? "Oui" : "Non" }}
            </td>
            <td data-label="filtrable">
              {{ field.filterable ? "Oui" : "Non" }}
            </td>
            <td>
              <div class="d-flex justify-content-between">
                <i class="fas fa-eye fa-1x text-primary" style="cursor: pointer" (click)="goToDetails(field)"></i>
                <i class="fa-solid fa-pencil text-success" style="cursor: pointer" (click)="goToEdit(field)">
                </i>
                <i class="fas fa-trash fa-1x text-danger" style="cursor: pointer" (click)="removeField(field)"></i>
              </div>
            </td>
          </tr>
          <tr *ngIf="!rows.length">
            <td colspan="3" class="text-center text-muted py-4">
              Aucune donnée enregistrée
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- ===== PAGINATION ===== -->
    <div class="d-flex justify-content-between align-items-center mt-3">
      <small class="text-muted">
      </small>
      <nav>
        <ul class="pagination pagination-sm pagination-pills mb-0">
          <li class="page-item" [class.disabled]="paginationService.page === 1">
            <button class="page-link" (click)="paginationService.goToPreviousPage()" [disabled]="paginationService.page === 1">
              <i class="fas fa-chevron-left"></i>
            </button>
          </li>

          <li class="page-item">
            {{ paginationService.page }}
          </li>

          <li class="page-item" [class.disabled]="!paginationService.pagination.hasNext">
            <button class="page-link" (click)="paginationService.goToNextPage()" [disabled]="!paginationService.pagination.hasNext">
              <i class="fas fa-chevron-right"></i>
            </button>
          </li>
        </ul>
      </nav>
    </div>
    <!-- ======================= -->
  </div>
</div>
