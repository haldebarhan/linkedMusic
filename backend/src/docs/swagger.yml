openapi: 3.0.0
info:
  title: "LINKEDMUSIC API"
  version: "1.0.0"
  description: "API documentation for LinkedMusic Management"

servers:
  - url: "https://"

components:
  schemas:
    Users:
      type: object
      properties:
        id:
          type: integer
          example: 1
        uid:
          type: string
          example: "uuuuuuid"
        email:
          type: string
          example: "johndoe@gmail.com"
        phone:
          type: string
          example: "0707070707"
        lastName:
          type: string
          example: "doe"
        firstName:
          type: string
          example: "john"
        role:
          type: string
          example: "USER"
        status:
          type: string
          example: "ACTIVATED"
        profileImage:
          type: string
          example: "https://example.com/profile.jpg"
        comments:
          type: string
          example: "this is a comments"
        createdAt:
          type: string
          example: "2022-01-01T12:00:00Z"
        updatedAt:
          type: string
          example: "2022-01-01T12:00:00Z"

    Metadata:
      type: object
      properties:
        limit:
          type: integer
          example: 20
        hasNext:
          type: boolean
        nextCursor:
          type: integer
          nullable: true

  parameters:
    cursorParam:
      name: cursor
      in: query
      description: Identifier of the last item from the preceding page (optional)
      schema:
        type: integer

    limitParam:
      in: query
      name: limit
      description: Number of items per page (optional, default is `10`)
      schema:
        type: integer
        default: 1

    orderParam:
      in: query
      name: order
      description: Order by creation date (optional, default is `desc`)
      schema:
        type: string
        enum:
          - asc
          - desc

    statusParam:
      in: query
      name: status
      description: filter by user `status`
      required: false
      schema:
        type: string
        enum: ["ACTIVATED", "DESACTIVATED", "SUSPENDED", "REMOVED", "CLOSED"]
        example: ACTIVATED

    idParam:
      in: path
      name: id
      description: ressource ID
      required: true
      schema:
        type: integer
        example: 1

    roleParam:
      in: query
      name: role
      description: filter by user `role`
      required: false
      schema:
        type: string
        enum: ["USER", "ADMIN", "PROVIDER"]
        example: USER

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  reponses:
    badRequestResponse:
      description: Bad Request (Invalid or missing required parameters)
    unauthorizedResponse:
      description: unauthorized access
    notFoundResponse:
      description: ressource not found
    internalServerErrorResponse:
      description: "Internal server error"

paths: {}
